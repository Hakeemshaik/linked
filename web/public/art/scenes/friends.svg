<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150"><style>.bob{animation:bob 2.6s ease-in-out infinite}.bob2{animation:bob 2.6s ease-in-out -1.3s infinite}
.waveR{animation:waveR 1.4s ease-in-out infinite}.waveL{animation:waveL 1.4s ease-in-out -.7s infinite}
.float{animation:float 3.2s ease-out infinite;opacity:0}.twinkle{animation:twinkle 1.8s ease-in-out infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.ring{animation:ring 1.6s ease-out infinite;opacity:0}
.hop{animation:hop 1.6s cubic-bezier(.3,.7,.4,1) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-34px) scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(0)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><ellipse cx="120" cy="140" rx="86.39999999999999" ry="7" fill="#000" opacity=".07"/><g transform="translate(24 42) scale(0.95)"><g class="bob"><defs><linearGradient id="b41" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#95E6CD"/><stop offset="1" stop-color="#3FC3A0"/></linearGradient></defs><rect x="-5" y="0" width="10" height="22" rx="5" fill="#3FC3A0" transform="translate(22 62) rotate(35)"/><g class="waveR" style="transform-origin:82px 60px"><rect x="-5" y="0" width="10" height="25" rx="5" fill="#3FC3A0" transform="translate(82 60) rotate(222)"/></g><ellipse cx="36" cy="16" rx="8" ry="20" fill="#3FC3A0" transform="rotate(-12 36 16)"/><ellipse cx="64" cy="16" rx="8" ry="20" fill="#3FC3A0" transform="rotate(12 64 16)"/><ellipse cx="36" cy="17" rx="4" ry="13" fill="#FFD6E2" transform="rotate(-12 36 17)"/><ellipse cx="64" cy="17" rx="4" ry="13" fill="#FFD6E2" transform="rotate(12 64 17)"/><path d="M50 21 C73 21 85 38 85 59 C85 80 71 90 50 90 C29 90 15 80 15 59 C15 38 27 21 50 21 Z" fill="url(#b41)"/><ellipse cx="35" cy="35" rx="10" ry="5.5" fill="#fff" opacity=".35" transform="rotate(-28 35 35)"/><ellipse cx="38" cy="55" rx="4.4" ry="5.4" fill="#2A1B3D"/><circle cx="39.6" cy="52.9" r="1.7" fill="#fff"/><ellipse cx="62" cy="55" rx="4.4" ry="5.4" fill="#2A1B3D"/><circle cx="63.6" cy="52.9" r="1.7" fill="#fff"/><ellipse cx="28" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="72" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><path d="M43 67 Q50 79 57 67 Z" fill="#7A1F3D"/><ellipse cx="50" cy="73.2" rx="3.4" ry="2.2" fill="#FF6F91"/></g></g><g transform="translate(120 42) scale(0.95)"><g class="bob2"><defs><linearGradient id="b42" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB472"/><stop offset="1" stop-color="#FF8A2B"/></linearGradient></defs><g class="waveL" style="transform-origin:18px 60px"><rect x="-5" y="0" width="10" height="25" rx="5" fill="#FF8A2B" transform="translate(18 60) rotate(138)"/></g><rect x="-5" y="0" width="10" height="22" rx="5" fill="#FF8A2B" transform="translate(78 62) rotate(-35)"/><path d="M17 48 L20 6 L48 28 Z" fill="#FF8A2B"/><path d="M83 48 L80 6 L52 28 Z" fill="#FF8A2B"/><path d="M23 36 L24 16 L38 28 Z" fill="#FFE4C8"/><path d="M77 36 L76 16 L62 28 Z" fill="#FFE4C8"/><path d="M50 21 C73 21 85 38 85 59 C85 80 71 90 50 90 C29 90 15 80 15 59 C15 38 27 21 50 21 Z" fill="url(#b42)"/><path d="M28 66 Q50 52 72 66 Q66 88 50 88 Q34 88 28 66 Z" fill="#FFF3E6"/><ellipse cx="35" cy="35" rx="10" ry="5.5" fill="#fff" opacity=".35" transform="rotate(-28 35 35)"/><path d="M33 56.5 Q38 50 43 56.5" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M57 56.5 Q62 50 67 56.5" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="28" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="72" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><path d="M43 67 Q50 79 57 67 Z" fill="#7A1F3D"/><ellipse cx="50" cy="73.2" rx="3.4" ry="2.2" fill="#FF6F91"/></g></g><g transform="translate(118 30)"><g class="float" style="animation-delay:0.2s;transform-origin:0px 0px"><path transform="translate(0 0) scale(0.2) translate(-50 -52)" d="M50 84 C22 66 12 48 17 33 C22 18 41 15 50 30 C59 15 78 18 83 33 C88 48 78 66 50 84 Z" fill="#FF5C8A"/></g></g><g transform="translate(128 36)"><g class="float" style="animation-delay:1.7s;transform-origin:0px 0px"><path transform="translate(0 0) scale(0.14) translate(-50 -52)" d="M50 84 C22 66 12 48 17 33 C22 18 41 15 50 30 C59 15 78 18 83 33 C88 48 78 66 50 84 Z" fill="#B89BFF"/></g></g><g transform="translate(22 32)"><g class="twinkle" style="animation-delay:0.6s;transform-origin:0px 0px"><path d="M0 -5 Q0.8999999999999999 -0.8999999999999999 5 0 Q0.8999999999999999 0.8999999999999999 0 5 Q-0.8999999999999999 0.8999999999999999 -5 0 Q-0.8999999999999999 -0.8999999999999999 0 -5 Z" fill="#FFD84A"/></g></g><g transform="translate(220 40)"><g class="twinkle" style="animation-delay:1.2s;transform-origin:0px 0px"><path d="M0 -6 Q1.08 -1.08 6 0 Q1.08 1.08 0 6 Q-1.08 1.08 -6 0 Q-1.08 -1.08 0 -6 Z" fill="#FFD84A"/></g></g></svg>