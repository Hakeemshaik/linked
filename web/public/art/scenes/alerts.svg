<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150"><style>.bob{animation:bob 2.6s ease-in-out infinite}.bob2{animation:bob 2.6s ease-in-out -1.3s infinite}
.waveR{animation:waveR 1.4s ease-in-out infinite}.waveL{animation:waveL 1.4s ease-in-out -.7s infinite}
.float{animation:float 3.2s ease-out infinite;opacity:0}.twinkle{animation:twinkle 1.8s ease-in-out infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.ring{animation:ring 1.6s ease-out infinite;opacity:0}
.hop{animation:hop 1.6s cubic-bezier(.3,.7,.4,1) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-34px) scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(0)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><ellipse cx="120" cy="140" rx="86.39999999999999" ry="7" fill="#000" opacity=".07"/><g transform="translate(120 72)"><ellipse rx="70" ry="10" cy="58" fill="#8F78FF" opacity=".12"/></g><g transform="translate(62 36) scale(1.05)"><g class="bob"><defs><linearGradient id="b40" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCD6F2"/></linearGradient></defs><path d="M50 18 C72 18 84 34 84 56 L84 86 Q78 80 72 86 Q66 92 60 86 Q55 80 50 86 Q45 92 40 86 Q34 80 28 86 Q22 92 16 86 L16 56 C16 34 28 18 50 18 Z" fill="url(#b40)"/><ellipse cx="35" cy="35" rx="10" ry="5.5" fill="#fff" opacity=".35" transform="rotate(-28 35 35)"/><path d="M33 54 Q38 59 43 54" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M57 54 Q62 59 67 54" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="28" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="72" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="50" cy="69" rx="3.4" ry="4.2" fill="#2A1B3D"/></g></g><g transform="translate(158 52)"><g class="float" style="animation-delay:0s;transform-origin:0px 0px"><path d="M0 0 H12 L0 14 H12" transform="scale(1)" stroke="#8F78FF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(164 48)"><g class="float" style="animation-delay:1.05s;transform-origin:0px 0px"><path d="M0 0 H12 L0 14 H12" transform="scale(0.8200000000000001)" stroke="#8F78FF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(170 44)"><g class="float" style="animation-delay:2.1s;transform-origin:0px 0px"><path d="M0 0 H12 L0 14 H12" transform="scale(0.64)" stroke="#8F78FF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>