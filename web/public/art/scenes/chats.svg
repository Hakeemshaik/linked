<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150"><style>.bob{animation:bob 2.6s ease-in-out infinite}.bob2{animation:bob 2.6s ease-in-out -1.3s infinite}
.waveR{animation:waveR 1.4s ease-in-out infinite}.waveL{animation:waveL 1.4s ease-in-out -.7s infinite}
.float{animation:float 3.2s ease-out infinite;opacity:0}.twinkle{animation:twinkle 1.8s ease-in-out infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.ring{animation:ring 1.6s ease-out infinite;opacity:0}
.hop{animation:hop 1.6s cubic-bezier(.3,.7,.4,1) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-34px) scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(0)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><ellipse cx="120" cy="140" rx="86.39999999999999" ry="7" fill="#000" opacity=".07"/><g transform="translate(26 44) scale(0.95)"><g class="bob"><defs><linearGradient id="b36" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86C6FF"/><stop offset="1" stop-color="#3F8EF0"/></linearGradient></defs><rect x="-5" y="0" width="10" height="22" rx="5" fill="#3F8EF0" transform="translate(22 62) rotate(35)"/><g class="waveR" style="transform-origin:82px 60px"><rect x="-5" y="0" width="10" height="25" rx="5" fill="#3F8EF0" transform="translate(82 60) rotate(222)"/></g><circle cx="25" cy="30" r="11" fill="#3F8EF0"/><circle cx="75" cy="30" r="11" fill="#3F8EF0"/><circle cx="25" cy="30" r="5.5" fill="#D4E8FF"/><circle cx="75" cy="30" r="5.5" fill="#D4E8FF"/><path d="M50 21 C73 21 85 38 85 59 C85 80 71 90 50 90 C29 90 15 80 15 59 C15 38 27 21 50 21 Z" fill="url(#b36)"/><ellipse cx="50" cy="69" rx="13" ry="9.5" fill="#D4E8FF"/><ellipse cx="50" cy="64.5" rx="4" ry="2.8" fill="#2A1B3D"/><ellipse cx="35" cy="35" rx="10" ry="5.5" fill="#fff" opacity=".35" transform="rotate(-28 35 35)"/><ellipse cx="38" cy="55" rx="4.4" ry="5.4" fill="#2A1B3D"/><circle cx="39.6" cy="52.9" r="1.7" fill="#fff"/><ellipse cx="62" cy="55" rx="4.4" ry="5.4" fill="#2A1B3D"/><circle cx="63.6" cy="52.9" r="1.7" fill="#fff"/><ellipse cx="28" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="72" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><path d="M43 72 Q50 84 57 72 Z" fill="#7A1F3D"/><ellipse cx="50" cy="78.2" rx="3.4" ry="2.2" fill="#FF6F91"/></g></g><g transform="translate(118 50) scale(0.9)"><g class="bob2"><defs><linearGradient id="b37" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA391"/><stop offset="1" stop-color="#F0685A"/></linearGradient></defs><rect x="-5" y="0" width="10" height="22" rx="5" fill="#F0685A" transform="translate(22 62) rotate(40)"/><rect x="-5" y="0" width="10" height="22" rx="5" fill="#F0685A" transform="translate(78 62) rotate(-40)"/><path d="M20 44 L24 12 L46 28 Z" fill="#F0685A"/><path d="M80 44 L76 12 L54 28 Z" fill="#F0685A"/><path d="M25 34 L27 20 L39 29 Z" fill="#FFD3C8"/><path d="M75 34 L73 20 L61 29 Z" fill="#FFD3C8"/><path d="M50 21 C73 21 85 38 85 59 C85 80 71 90 50 90 C29 90 15 80 15 59 C15 38 27 21 50 21 Z" fill="url(#b37)"/><ellipse cx="35" cy="35" rx="10" ry="5.5" fill="#fff" opacity=".35" transform="rotate(-28 35 35)"/><path d="M33 56.5 Q38 50 43 56.5" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M57 56.5 Q62 50 67 56.5" stroke="#2A1B3D" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="28" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><ellipse cx="72" cy="65" rx="5.2" ry="3.2" fill="#FF8FB1" opacity=".6"/><path d="M18 64 H28 M18 70 L28 68 M82 64 H72 M82 70 L72 68" stroke="#2A1B3D" stroke-width="1.6" stroke-linecap="round" opacity=".5"/><path d="M44 68 Q47 72.5 50 68 Q53 72.5 56 68" stroke="#2A1B3D" stroke-width="2.6" fill="none" stroke-linecap="round"/></g></g><g transform="translate(84 6)"><path d="M0 14 Q0 0 14 0 H58 Q72 0 72 14 V22 Q72 36 58 36 H26 L14 46 L16 36 H14 Q0 36 0 22 Z" fill="#fff" stroke="#2A1B3D" stroke-width="2.5" stroke-linejoin="round"/><g transform="translate(22 18)"><circle class="dot" style="animation-delay:0s" r="4.2" fill="#8F78FF"/></g><g transform="translate(36 18)"><circle class="dot" style="animation-delay:0.15s" r="4.2" fill="#8F78FF"/></g><g transform="translate(50 18)"><circle class="dot" style="animation-delay:0.3s" r="4.2" fill="#8F78FF"/></g></g><g transform="translate(206 70)"><g class="float" style="animation-delay:0.4s;transform-origin:0px 0px"><path transform="translate(0 0) scale(0.2) translate(-50 -52)" d="M50 84 C22 66 12 48 17 33 C22 18 41 15 50 30 C59 15 78 18 83 33 C88 48 78 66 50 84 Z" fill="#FF5C8A"/></g></g><g transform="translate(196 86)"><g class="float" style="animation-delay:1.8s;transform-origin:0px 0px"><path transform="translate(0 0) scale(0.14) translate(-50 -52)" d="M50 84 C22 66 12 48 17 33 C22 18 41 15 50 30 C59 15 78 18 83 33 C88 48 78 66 50 84 Z" fill="#FF9ACB"/></g></g></svg>